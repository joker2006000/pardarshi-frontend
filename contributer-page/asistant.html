<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f6">
  <title>PARDARSHI AI Assistant</title>
  <style>
    /* Mobile-first light interface */
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f6;
      color: #17211b;
      font-synthesis: none;
      --green: #07875d;
      --muted: #718078;
      --panel: #ffffff;
      --line: rgba(25,55,40,.11);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #f5f7f6; }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    .app {
      height: 100dvh;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: var(--safe-top) 0 var(--safe-bottom);
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 100%, rgba(16,135,93,.055), transparent 44%), #f5f7f6;
    }
    header {
      min-height: 62px;
      padding: 9px 14px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(25,55,40,.08);
    }
    .connection { display: grid; gap: 3px; font-size: 10px; color: var(--muted); }
    .connection-main { display: flex; align-items: center; gap: 6px; color: #34443b; font-size: 11px; font-weight: 600; }
    .connection-label[hidden], .latency-label[hidden] { display: none; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #aab4ae; box-shadow: 0 0 0 3px rgba(104,113,108,.12); }
    .status-dot.connected { background: var(--green); box-shadow: 0 0 0 3px rgba(16,135,93,.14); }
    .status-dot.pending { background: #f5b942; animation: blink 1s infinite alternate; }
    .status-dot.error { background: #aab4ae; box-shadow: 0 0 0 3px rgba(104,113,108,.08); }
    .brand { text-align: right; line-height: 1.15; }
    .brand strong { display: block; color: var(--green); font-size: 12px; letter-spacing: .1em; }
    .brand span { display: block; margin-top: 3px; color: #7d8982; font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
    @keyframes blink { to { opacity: .35; } }

    .feed {
      flex: 1;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 22px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: #c6d0ca transparent;
    }
    .feed-empty { margin: auto; max-width: 290px; text-align: center; color: #69776f; }
    .empty-mark {
      width: 56px; height: 56px; margin: 0 auto 15px; border-radius: 20px;
      display: grid; place-items: center; color: var(--green);
      border: 1px solid rgba(16,135,93,.22); background: rgba(16,135,93,.06);
      box-shadow: 0 0 35px rgba(16,135,93,.08);
    }
    .empty-mark svg { width: 26px; height: 26px; }
    .feed-empty h1 { margin: 0 0 8px; color: #23332a; font-size: 16px; font-weight: 600; }
    .feed-empty p { margin: 0; font-size: 12px; line-height: 1.65; }
    .data-card {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: linear-gradient(145deg, #ffffff, #f8faf9);
      box-shadow: 0 12px 30px rgba(25,55,40,.07);
      animation: card-in .28s ease both;
    }
    .response-content { margin-top: 12px; color: #34443b; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
    .response-content h1, .response-content h2, .response-content h3 { margin: 12px 0 6px; color: #23332a; font-size: 14px; }
    .response-content p, .response-content ul, .response-content ol, .response-content blockquote, .response-content pre { margin: 8px 0; }
    .response-content ul, .response-content ol { padding-left: 22px; }
    .response-content blockquote { padding-left: 10px; border-left: 2px solid rgba(16,135,93,.35); color: #617168; }
    .response-content pre { overflow-x: auto; padding: 10px; border-radius: 8px; background: #f1f5f2; }
    .response-content code { padding: 1px 4px; border-radius: 4px; background: #f1f5f2; font-family: ui-monospace, monospace; }
    .response-content pre code { padding: 0; background: transparent; }
    .response-content a { color: #08734f; }
    .response-content hr { margin: 10px 0; border: 0; border-top: 1px solid var(--line); }
    @keyframes card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .card-kicker { color: var(--green); font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .card-title { margin: 5px 0 0; font-size: 15px; line-height: 1.35; font-weight: 650; }
    .verified {
      flex: none; padding: 5px 8px; border-radius: 999px;
      color: #08734f; background: rgba(16,135,93,.10);
      font-size: 9px; font-weight: 650; white-space: nowrap;
    }
    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin: 14px 0; }
    .metric { padding: 11px; border-radius: 11px; background: #f1f5f2; }
    .metric span { display: block; color: #728078; font-size: 10px; }
    .metric strong { display: block; margin-top: 5px; color: #1c2a22; font-size: 15px; font-variant-numeric: tabular-nums; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 11px; }
    th { padding: 9px 7px; color: #718078; font-size: 9px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
    td { padding: 10px 7px; color: #34443b; border-bottom: 1px solid rgba(25,55,40,.07); vertical-align: top; }
    tbody tr:last-child td { border-bottom: 0; }
    .amount { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .card-footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: #718078; font-size: 10px; }
    .scroll-bottom {
      position: absolute; z-index: 3; left: 50%;       bottom: calc(145px + var(--safe-bottom));
      transform: translateX(-50%); padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px;
      color: #26372d; background: #ffffff; font-size: 11px; box-shadow: 0 4px 16px rgba(25,55,40,.14);
    }
    .scroll-bottom[hidden] { display: none; }

    .live-status { min-height: 18px; padding: 0 16px; display: flex; align-items: center; justify-content: center; gap: 6px; color: #718078; font-size: 10px; }
    .live-status .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .live-status[data-state="THINKING"] .live-dot { background: #f5b942; animation: blink .7s infinite alternate; }
    .live-status[data-state="ERROR"] .live-dot { background: #ef5c5c; }
    .visualizer { position: relative; height: 66px; flex: none; overflow: hidden; }
    #waveform { width: 100%; height: 100%; display: block; }
    .interrupt-ripple { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; border: 1px solid rgba(66,133,244,.8); border-radius: 50%; opacity: 0; transform: translate(-50%,-50%) scale(.6); pointer-events: none; }
    .interrupt-ripple.active { animation: ripple .55s ease-out; }
    @keyframes ripple { to { opacity: 0; transform: translate(-50%,-50%) scale(7); } }
    footer { flex: none; padding: 2px 16px 8px; display: flex; justify-content: center; align-items: center; gap: 18px; }
    .control {
      border: 0; display: grid; place-items: center; cursor: pointer; color: #fff;
      transition: transform .18s ease, opacity .18s ease;
    }
    .control:active { transform: scale(.94); }
    .control:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
    .cancel {
      position: relative; z-index: 21; width: 44px; height: 44px; border: 1px solid rgba(25,55,40,.1); border-radius: 50%;
      background: #ffffff; color: #cf4e4e; font-size: 19px;
    }
    .mic-wrap { display: grid; justify-items: center; gap: 5px; }
    .mic {
      width: 64px; height: 64px; position: relative; border: 1px solid rgba(16,135,93,.32);
      border-radius: 50%; background: radial-gradient(circle at 50% 40%, #ffffff, #e8f4ee);
      box-shadow: 0 0 0 7px rgba(16,135,93,.045), 0 10px 30px rgba(16,135,93,.16), inset 0 1px 3px #fff;
      color: #07875d;
      isolation: isolate;
      transition: transform .2s ease, box-shadow .25s ease, background .25s ease;
    }
    .mic > span { position: relative; z-index: 1; width: 28px; height: 28px; display: grid; place-items: center; }
    .mic svg { width: 25px; height: 25px; display: block; }
    .mic::before, .mic::after { content: ""; position: absolute; z-index: -1; inset: -8px; border: 1px solid rgba(16,135,93,.16); border-radius: 50%; opacity: 0; transform: scale(.92); pointer-events: none; }
    .mic.active::before, .mic.active::after { opacity: 1; }
    .mic.active::before { inset: calc(-7px - var(--voice-ring, 0px)); border-color: rgba(16,135,93,.4); transform: scale(var(--voice-scale, 1)); transition: inset 120ms ease-out, transform 120ms ease-out; animation: mic-idle-pulse 2.2s ease-in-out infinite; }
    .mic.active::after { inset: calc(-14px - var(--voice-outer, 0px)); border-color: rgba(16,135,93,.2); transform: scale(var(--voice-scale, 1)); transition: inset 150ms ease-out, transform 150ms ease-out; animation: mic-idle-pulse 2.2s .55s ease-in-out infinite; }
    @keyframes mic-idle-pulse { 50% { opacity: .42; } }
    .mic.active.voice-detected { background: radial-gradient(circle at 50% 38%, #f5fff9, #d9f3e5); box-shadow: 0 0 0 7px rgba(16,135,93,.07), 0 10px 34px rgba(16,135,93,.26), inset 0 1px 3px #fff; }
    .mic:active { transform: scale(.96); }
    .mic.barge-in { animation: barge-in .45s ease-out; }
    @keyframes barge-in { 50% { box-shadow: 0 0 0 12px rgba(66,133,244,.14), 0 8px 26px rgba(16,135,93,.14); } }
    .mic-label { min-height: 10px; color: #64766c; font-size: 8px; font-weight: 650; letter-spacing: .11em; }
    .mic:disabled { opacity: .55; cursor: wait; }
    /* Branded startup overlay */
    .splash {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
      padding: 24px; background: #f5f7f6; transition: opacity .45s ease, visibility .45s ease;
    }
    .splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-content { width: min(290px,100%); text-align: center; }
    .splash-orb { width: 54px; height: 54px; margin: 0 auto 20px; border: 2px solid rgba(16,135,93,.18); border-top-color: var(--green); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .splash-title { color: var(--green); font-size: 13px; font-weight: 700; letter-spacing: .16em; }
    .splash-step { margin: 14px 0 10px; color: #718078; font-size: 11px; }
    .progress { height: 2px; overflow: hidden; background: #dce4df; border-radius: 2px; }
    .progress span { display: block; height: 100%; width: 10%; background: var(--green); transition: width .3s ease; }
    @media (min-width: 600px) {
      .app { max-width: 480px; margin: auto; height: 100dvh; border-inline: 1px solid rgba(25,55,40,.06); }
      body { background: #e9eeeb; }
      .data-card { padding: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="connection" aria-live="polite">
        <div class="connection-main"><span id="connection-dot" class="status-dot pending"></span><span id="connection-label" class="connection-label">Starting…</span></div>
        <span id="latency-label" class="latency-label">Waiting for audio</span>
      </div>
      <div class="brand"><strong>PARDARSHI</strong><span>AI Assistant</span></div>
    </header>

    <main id="data-feed" class="feed" aria-label="Assistant responses" aria-live="polite">
      <div id="empty-state" class="feed-empty">
        <div class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M5.6 6.2l12.8 11.6M18.4 6.2 5.6 17.8M3 12h18"/><circle cx="12" cy="12" r="8.5"/></svg>
        </div>
        <h1>Listening for your request</h1>
        <p>Your microphone stays on while this session is active. Assistant responses and tables will appear here.</p>
      </div>
    </main>
    <button id="scroll-bottom" class="scroll-bottom" type="button" hidden>↓ &nbsp; Latest data</button>

    <div id="live-status" class="live-status" data-state="IDLE" role="status" aria-live="polite">
      <span class="live-dot"></span><span id="live-status-text">Microphone starting…</span>
    </div>
    <div id="visualizer" class="visualizer" aria-hidden="true">
      <canvas id="waveform"></canvas>
    </div>
    <footer>
      <button id="btn-cancel" class="control cancel" type="button" aria-label="End session and clear data">×</button>
      <div class="mic-wrap">
        <button id="btn-mic" class="control mic" type="button" aria-label="Microphone is live"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M9 21.5h6"/></svg></span></button>
        <span id="mic-label" class="mic-label">MIC STARTING</span>
      </div>
      <div aria-hidden="true" style="width:44px;height:44px"></div>
    </footer>
  </div>

  <section id="splash" class="splash" aria-label="Initializing assistant">
    <div class="splash-content">
      <div class="splash-orb"></div>
      <div class="splash-title">PARDARSHI AI</div>
      <div id="splash-step" class="splash-step">Initializing AudioContext…</div>
      <div class="progress"><span id="progress-bar"></span></div>
    </div>
  </section>

  <script>
    "use strict";

    const LIVE_WS_URL = "wss://pardarshi-server-1.onrender.com/ai-stream";
    const PCM_RATE = 16000;
    const assistantParams = new URLSearchParams(window.location.search);
    const orgSlug = assistantParams.get("org") || localStorage.getItem("pardarshi_last_org") || "";
    const projectSlug = assistantParams.get("proj") || assistantParams.get("project") || "";

    const dom = {
      feed: document.getElementById("data-feed"),
      empty: document.getElementById("empty-state"),
      connectionDot: document.getElementById("connection-dot"),
      connectionLabel: document.getElementById("connection-label"),
      latency: document.getElementById("latency-label"),
      visualizer: document.getElementById("visualizer"),
      status: document.getElementById("live-status"),
      statusText: document.getElementById("live-status-text"),
      mic: document.getElementById("btn-mic"),
      micLabel: document.getElementById("mic-label"),
      cancel: document.getElementById("btn-cancel"),
      splash: document.getElementById("splash"),
      splashStep: document.getElementById("splash-step"),
      progress: document.getElementById("progress-bar"),
      scrollButton: document.getElementById("scroll-bottom"),
      canvas: document.getElementById("waveform"),
    };

    const UIController = (() => {
      const State = Object.freeze({ IDLE: "IDLE", LISTENING: "LISTENING", THINKING: "THINKING", SPEAKING: "SPEAKING", ERROR: "ERROR" });
      let state = State.IDLE;
      let audioLevel = 0;

      function setState(next, message) {
        state = next;
        dom.status.dataset.state = next;
        dom.statusText.textContent = message || ({
          IDLE: "Microphone is off",
          LISTENING: "Microphone is live · waiting for speech",
          THINKING: "Organizing structured data…",
          SPEAKING: "Receiving structured data…",
          ERROR: ""
        })[next];
        window.dispatchEvent(new Event("assistant-state-change"));
      }

      function setConnection(label, mode, detail) {
        dom.connectionLabel.textContent = label;
        dom.connectionDot.className = "status-dot " + mode;
        dom.latency.textContent = detail;
        const showStatus = mode === "connected" || mode === "pending";
        dom.connectionLabel.hidden = !showStatus || !label;
        dom.latency.hidden = !showStatus || !detail;
      }

      function setAudioLevel(value) {
        audioLevel = value;
        const level = Math.min(1, Math.max(0, value * 10));
        dom.mic.style.setProperty("--voice-level", level.toFixed(3));
        dom.mic.style.setProperty("--voice-ring", `${(level * 10).toFixed(1)}px`);
        dom.mic.style.setProperty("--voice-outer", `${(level * 16).toFixed(1)}px`);
        dom.mic.style.setProperty("--voice-scale", (1 + level * .12).toFixed(3));
        dom.mic.classList.toggle("voice-detected", level > .12);
      }

      function setMicActive(active, label) {
        dom.mic.classList.toggle("active", active);
        dom.micLabel.textContent = label;
        dom.mic.setAttribute("aria-label", active ? "Microphone is live" : "Start microphone");
        if (!active) setAudioLevel(0);
      }

      let currentResponse = null;
      let currentResponseText = "";

      function appendInlineMarkdown(parent, text) {
        const pattern = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|\*\*(.+?)\*\*|__(.+?)__|~~(.+?)~~|`([^`]+)`|\*([^*]+)\*|_([^_]+)_/g;
        let lastIndex = 0;
        let match;
        while ((match = pattern.exec(text))) {
          parent.append(document.createTextNode(text.slice(lastIndex, match.index)));
          let element;
          if (match[1] !== undefined) {
            element = document.createElement("a");
            element.textContent = match[1];
            element.href = match[2];
            element.target = "_blank";
            element.rel = "noopener noreferrer";
          } else if (match[3] !== undefined || match[4] !== undefined) {
            element = document.createElement("strong");
            element.textContent = match[3] || match[4];
          } else if (match[5] !== undefined) {
            element = document.createElement("del");
            element.textContent = match[5];
          } else if (match[6] !== undefined) {
            element = document.createElement("code");
            element.textContent = match[6];
          } else {
            element = document.createElement("em");
            element.textContent = match[7] || match[8];
          }
          parent.append(element);
          lastIndex = pattern.lastIndex;
        }
        parent.append(document.createTextNode(text.slice(lastIndex)));
      }

      function tableCells(line) {
        const cells = [];
        let cell = "";
        let escaped = false;
        for (const character of line.trim()) {
          if (escaped) {
            cell += character;
            escaped = false;
          } else if (character === "\\") {
            escaped = true;
          } else if (character === "|") {
            cells.push(cell.trim());
            cell = "";
          } else {
            cell += character;
          }
        }
        cells.push(cell.trim());
        if (cells[0] === "") cells.shift();
        if (cells[cells.length - 1] === "") cells.pop();
        return cells;
      }

      function appendMarkdown(container, text) {
        const lines = text.split(/\r?\n/);
        let paragraph = [];
        const flushParagraph = () => {
          if (!paragraph.length) return;
          const block = document.createElement("p");
          paragraph.forEach((line, index) => {
            if (index) block.append(document.createElement("br"));
            appendInlineMarkdown(block, line);
          });
          container.append(block);
          paragraph = [];
        };
        const isListItem = line => /^\s*(?:[-+*]|\d+[.)])\s+/.test(line);
        const isTableRule = line => {
          const cells = tableCells(line);
          return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
        };

        for (let index = 0; index < lines.length;) {
          const line = lines[index];
          if (!line.trim()) {
            flushParagraph();
            index++;
            continue;
          }
          if (/^\s*```/.test(line)) {
            flushParagraph();
            const code = [];
            index++;
            while (index < lines.length && !/^\s*```/.test(lines[index])) code.push(lines[index++]);
            if (index < lines.length) index++;
            const pre = document.createElement("pre");
            const codeElement = document.createElement("code");
            codeElement.textContent = code.join("\n");
            pre.append(codeElement);
            container.append(pre);
            continue;
          }
          if (line.includes("|") && index + 1 < lines.length && isTableRule(lines[index + 1])) {
            flushParagraph();
            const headers = tableCells(line);
            const table = document.createElement("table");
            const head = document.createElement("thead");
            const headerRow = document.createElement("tr");
            headers.forEach(value => {
              const cell = document.createElement("th");
              appendInlineMarkdown(cell, value);
              headerRow.append(cell);
            });
            head.append(headerRow);
            table.append(head);
            const body = document.createElement("tbody");
            index += 2;
            while (index < lines.length && lines[index].includes("|") && lines[index].trim()) {
              const row = document.createElement("tr");
              tableCells(lines[index++]).forEach(value => {
                const cell = document.createElement("td");
                appendInlineMarkdown(cell, value);
                row.append(cell);
              });
              body.append(row);
            }
            table.append(body);
            const wrap = document.createElement("div");
            wrap.className = "table-wrap";
            wrap.append(table);
            container.append(wrap);
            continue;
          }
          const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
          if (heading) {
            flushParagraph();
            const element = document.createElement(`h${Math.min(3, heading[1].length)}`);
            appendInlineMarkdown(element, heading[2]);
            container.append(element);
            index++;
            continue;
          }
          if (/^\s*(?:---+|___+|\*\*\*+)\s*$/.test(line)) {
            flushParagraph();
            container.append(document.createElement("hr"));
            index++;
            continue;
          }
          if (/^\s*>\s?/.test(line)) {
            flushParagraph();
            const quote = document.createElement("blockquote");
            while (index < lines.length && /^\s*>\s?/.test(lines[index])) {
              const quoteLine = lines[index++].replace(/^\s*>\s?/, "");
              if (quote.childNodes.length) quote.append(document.createElement("br"));
              appendInlineMarkdown(quote, quoteLine);
            }
            container.append(quote);
            continue;
          }
          if (isListItem(line)) {
            flushParagraph();
            const ordered = /^\s*\d+[.)]\s+/.test(line);
            const list = document.createElement(ordered ? "ol" : "ul");
            while (index < lines.length && isListItem(lines[index])) {
              const item = document.createElement("li");
              appendInlineMarkdown(item, lines[index++].replace(/^\s*(?:[-+*]|\d+[.)])\s+/, ""));
              list.append(item);
            }
            container.append(list);
            continue;
          }
          paragraph.push(line);
          index++;
        }
        flushParagraph();
      }

      function appendAssistantText(text) {
        if (typeof text !== "string" || !text) return;
        const wasNearBottom = isNearBottom();
        if (!currentResponse) {
          currentResponseText = "";
          currentResponse = document.createElement("article");
          currentResponse.className = "data-card";
          const heading = document.createElement("div");
          heading.className = "card-heading";
          const titleGroup = document.createElement("div");
          const kicker = document.createElement("div");
          kicker.className = "card-kicker";
          kicker.textContent = "AI response";
          const title = document.createElement("h2");
          title.className = "card-title";
          title.textContent = "PARDARSHI Assistant";
          titleGroup.append(kicker, title);
          heading.append(titleGroup);
          const content = document.createElement("div");
          content.className = "response-content";
          const footer = document.createElement("div");
          footer.className = "card-footer";
          const source = document.createElement("span");
          source.textContent = "PARDARSHI AI";
          const time = document.createElement("time");
          time.dateTime = new Date().toISOString();
          time.textContent = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(new Date());
          footer.append(source, time);
          currentResponse.append(heading, content, footer);
          dom.empty.hidden = true;
          dom.feed.append(currentResponse);
        }
        currentResponseText += text;
        const content = currentResponse.querySelector(".response-content");
        content.replaceChildren();
        appendMarkdown(content, currentResponseText);
        if (wasNearBottom) dom.feed.scrollTo({ top: dom.feed.scrollHeight, behavior: "smooth" });
        else dom.scrollButton.hidden = false;
      }

      function finishAssistantResponse() {
        currentResponse = null;
        currentResponseText = "";
      }

      function isNearBottom() {
        return dom.feed.scrollHeight - dom.feed.scrollTop - dom.feed.clientHeight < 90;
      }

      return {
        State,
        setState,
        getState: () => state,
        setConnection,
        setMicActive,
        appendAssistantText,
        finishAssistantResponse,
        isNearBottom,
        setAudioLevel,
        getAudioLevel: () => audioLevel
      };
    })();

    const LiveWebSocketClient = (() => {
      let socket = null;
      let connected = false;
      let closedByUser = false;
      let connectTimer = null;
      let onData = () => {};
      let onAudio = () => {};
      let onConnection = () => {};
      let onActivity = () => {};
      let onError = () => {};

      function connect(handlers = {}) {
        onData = handlers.onData || (() => {});
        onAudio = handlers.onAudio || (() => {});
        onConnection = handlers.onConnection || (() => {});
        onActivity = handlers.onActivity || (() => {});
        onError = handlers.onError || (() => {});
        closedByUser = false;
        if (!orgSlug) return Promise.reject(new Error("Organization is missing. Return to the organization page and open the assistant there."));
        return new Promise((resolve, reject) => {
          let settled = false;
          const fail = error => {
            if (settled) return;
            settled = true;
            clearTimeout(connectTimer);
            reject(error);
          };
          connectTimer = setTimeout(() => {
            fail(new Error("Timed out waiting for the server to complete the assistant handshake."));
            if (socket && socket.readyState === WebSocket.OPEN) socket.close();
          }, 30000);
          try {
            const connectionSocket = new WebSocket(LIVE_WS_URL);
            socket = connectionSocket;
            connectionSocket.onopen = () => {
              onConnection(false, "Connecting");
              const data = { orgSlug };
              if (projectSlug) data.projectSlug = projectSlug;
              try {
                connectionSocket.send(JSON.stringify({ type: "auth_handshake", data }));
              } catch (error) {
                fail(error instanceof Error ? error : new Error(String(error)));
              }
            };
            connectionSocket.onerror = () => fail(new Error("Unable to connect to the PARDARSHI AI server."));
            connectionSocket.onclose = () => {
              connected = false;
              fail(new Error("The PARDARSHI AI server closed the connection before the handshake completed."));
              if (!closedByUser) {
                onConnection(false, "Connection lost");
                onError(new Error("Connection to the PARDARSHI AI server was lost."));
              }
            };
            connectionSocket.onmessage = event => handleServerMessage(event.data, {
              fail,
              completeHandshake: context => {
                connected = true;
                if (!settled) {
                  settled = true;
                  clearTimeout(connectTimer);
                  resolve();
                }
                const detail = [context.organization, context.scope].filter(Boolean).join(" · ");
                onConnection(true, "Connected", detail || "Organization data loaded");
              }
            });
          } catch (error) {
            fail(error instanceof Error ? error : new Error(String(error)));
          }
        });
      }

      function sendAudioChunk(pcm16) {
        if (!connected || !socket || socket.readyState !== WebSocket.OPEN) return;
        const bytes = new Uint8Array(pcm16.buffer, pcm16.byteOffset, pcm16.byteLength);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        try {
          socket.send(JSON.stringify({ type: "realtime_audio", audioBase64: btoa(binary) }));
        } catch (error) {
          console.error("Unable to send microphone audio to the AI server.", error);
          onError(new Error("Microphone audio could not be sent to the AI server."));
        }
      }

      function handleServerMessage(raw, callbacks) {
        let message;
        try { message = JSON.parse(raw); }
        catch (error) {
          console.error("Invalid message from live bridge.", error);
          onError(new Error("The AI server sent an invalid response."));
          return;
        }
        if (message.type === "handshake_success") {
          callbacks.completeHandshake(message.context || {});
          return;
        }
        if (message.type === "error") {
          const error = new Error(typeof message.message === "string" ? message.message : "The AI server reported an error.");
          if (!connected) callbacks.fail(error);
          onError(error);
          return;
        }
        if (message.type === "ai_disconnected") {
          connected = false;
          const error = new Error("The AI service disconnected the session.");
          onConnection(false, "AI disconnected");
          callbacks.fail(error);
          onError(error);
          return;
        }
        const content = message.serverContent;
        if (content) {
          const parts = content.modelTurn && content.modelTurn.parts;
          let text = "";
          if (Array.isArray(parts)) {
            for (const part of parts) {
              if (typeof part.text === "string") text += part.text;
              const audio = part.inlineData || part.inline_data;
              if (audio && typeof audio.data === "string") onAudio(audio.data, audio.mimeType || audio.mime_type || "");
            }
          }
          const transcription = content.outputTranscription && content.outputTranscription.text;
          if (text) onData(text);
          else if (typeof transcription === "string" && transcription) onData(transcription);
          if (content.turnComplete || content.interrupted) {
            onActivity("complete");
          }
        }
      }

      function disconnect() {
        closedByUser = true;
        connected = false;
        clearTimeout(connectTimer);
        const closingSocket = socket;
        socket = null;
        onConnection(false, "Disconnected");
        if (!closingSocket || closingSocket.readyState === WebSocket.CLOSED) return Promise.resolve();
        return new Promise(resolve => {
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            clearTimeout(closeTimer);
            resolve();
          };
          const closeTimer = setTimeout(finish, 500);
          closingSocket.addEventListener("close", finish, { once: true });
          try {
            closingSocket.close(1000, "Session ended");
          } catch (error) {
            console.error("Unable to close the AI WebSocket cleanly.", error);
            finish();
          }
        });
      }

      return { connect, sendAudioChunk, disconnect };
    })();

    const AudioEngine = (() => {
      let context = null;
      let stream = null;
      let source = null;
      let processor = null;
      let processorKind = "";
      let mute = null;
      let active = false;
      let onChunk = () => {};
      let onSpeechStart = () => {};
      let onSpeechEnd = () => {};
      let speechStartedAt = 0;
      let silenceStartedAt = 0;
      let voicedDuration = 0;
      let hasSpeech = false;
      let frame = null;
      let outputTime = 0;
      const playbackSources = new Set();
      const SPEECH_RMS = 0.022;
      const END_SILENCE_MS = 850;

      async function start(handlers = {}) {
        onChunk = handlers.onChunk || onChunk;
        onSpeechStart = handlers.onSpeechStart || onSpeechStart;
        onSpeechEnd = handlers.onSpeechEnd || onSpeechEnd;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Microphone access requires HTTPS or localhost in a supported browser.");
        }
        stop();
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false
        });
        context = new (window.AudioContext || window.webkitAudioContext)();
        await context.resume();
        source = context.createMediaStreamSource(stream);

        mute = context.createGain();
        mute.gain.value = 0;

        const handleInput = input => {
          if (!active) return;
          let sum = 0;
          for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
          const rms = Math.sqrt(sum / input.length);
          UIController.setAudioLevel(rms);
          onChunk(resampleToPcm16(input, context.sampleRate, PCM_RATE));
          updateVoiceActivity(rms, input.length / context.sampleRate * 1000);
        };
        if (context.audioWorklet && typeof AudioWorkletNode !== "undefined") {
          const workletSource = `
            class PardarshiCaptureProcessor extends AudioWorkletProcessor {
              constructor() {
                super();
                this.buffer = new Float32Array(4096);
                this.offset = 0;
              }
              process(inputs, outputs) {
                const channels = inputs[0];
                const output = outputs[0];
                if (output) for (const channel of output) channel.fill(0);
                if (!channels || !channels.length) return true;
                const input = channels[0];
                for (let i = 0; i < input.length; i++) {
                  let sample = 0;
                  for (const channel of channels) sample += channel[i] || 0;
                  this.buffer[this.offset++] = sample / channels.length;
                  if (this.offset === this.buffer.length) {
                    const packet = this.buffer;
                    this.port.postMessage(packet, [packet.buffer]);
                    this.buffer = new Float32Array(4096);
                    this.offset = 0;
                  }
                }
                return true;
              }
            }
            registerProcessor("pardarshi-capture", PardarshiCaptureProcessor);
          `;
          const moduleUrl = URL.createObjectURL(new Blob([workletSource], { type: "text/javascript" }));
          try {
            await context.audioWorklet.addModule(moduleUrl);
            processor = new AudioWorkletNode(context, "pardarshi-capture", {
              numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1]
            });
            processor.port.onmessage = event => handleInput(event.data);
            processorKind = "worklet";
          } catch (error) {
            console.warn("AudioWorklet unavailable; using the compatibility audio processor.", error);
          } finally {
            URL.revokeObjectURL(moduleUrl);
          }
        }
        if (!processor && typeof context.createScriptProcessor === "function") {
          processor = context.createScriptProcessor(4096, 1, 1);
          processor.onaudioprocess = event => handleInput(event.inputBuffer.getChannelData(0));
          processorKind = "script";
        }
        if (!processor) throw new Error("This browser does not support microphone audio processing.");
        source.connect(processor);
        processor.connect(mute);
        mute.connect(context.destination);
        active = true;
        drawVisualizer();
        return context.sampleRate;
      }

      function resampleToPcm16(input, inputRate, outputRate) {
        const ratio = inputRate / outputRate;
        const length = Math.max(1, Math.floor(input.length / ratio));
        const pcm = new Int16Array(length);
        for (let i = 0; i < length; i++) {
          const position = i * ratio;
          const before = Math.floor(position);
          const after = Math.min(before + 1, input.length - 1);
          const fraction = position - before;
          const sample = input[before] * (1 - fraction) + input[after] * fraction;
          pcm[i] = Math.round(Math.max(-1, Math.min(1, sample)) * (sample < 0 ? 32768 : 32767));
        }
        return pcm;
      }

      function updateVoiceActivity(rms, duration) {
        if (rms >= SPEECH_RMS) {
          voicedDuration += duration;
          silenceStartedAt = 0;
          if (!hasSpeech && voicedDuration >= 160) {
            hasSpeech = true;
            speechStartedAt = performance.now();
            onSpeechStart();
          }
        } else {
          voicedDuration = Math.max(0, voicedDuration - duration * 1.8);
          if (hasSpeech) {
            if (!silenceStartedAt) silenceStartedAt = performance.now();
            if (performance.now() - silenceStartedAt >= END_SILENCE_MS) {
              hasSpeech = false;
              silenceStartedAt = 0;
              onSpeechEnd(Math.round(performance.now() - speechStartedAt));
            }
          }
        }
      }

      function drawVisualizer() {
        cancelAnimationFrame(frame);
        const canvas = dom.canvas;
        const rect = canvas.getBoundingClientRect();
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(rect.width * scale));
        canvas.height = Math.max(1, Math.floor(rect.height * scale));
        const ctx = canvas.getContext("2d");
        const colors = ["#4285F4", "#EA4335", "#FBBC05", "#34A853", "#9C27B0"];
        const render = timestamp => {
          if (!ctx) return;
          const width = canvas.width;
          const height = canvas.height;
          ctx.clearRect(0, 0, width, height);
          const state = UIController.getState();
          const center = height / 2;
          const thinking = state === UIController.State.THINKING;
          const speaking = state === UIController.State.SPEAKING;
          const phase = timestamp * (thinking ? .0018 : speaking ? .0025 : .0008);
          const amplitude = (thinking ? 6 : speaking ? 10 : 2.4) * scale;
          const gradient = ctx.createLinearGradient(0, 0, width, 0);
          colors.forEach((color, index) => gradient.addColorStop(index / (colors.length - 1), color));

          ctx.beginPath();
          for (let x = 0; x <= width; x += 2 * scale) {
            const progress = x / width;
            const envelope = Math.sin(progress * Math.PI) * .8 + .2;
            const y = center + Math.sin(progress * 11 - phase) * amplitude * envelope
              + Math.sin(progress * 19 - phase * .72) * amplitude * .28;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = gradient;
          ctx.globalAlpha = thinking || speaking ? .95 : .56;
          ctx.lineWidth = (thinking || speaking ? 2.3 : 1.8) * scale;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.shadowColor = "rgba(16,135,93,.16)";
          ctx.shadowBlur = 12 * scale;
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1;
          frame = requestAnimationFrame(render);
        };
        frame = requestAnimationFrame(render);
      }

      window.addEventListener("assistant-state-change", drawVisualizer);

      function playAudioChunk(base64, mimeType) {
        if (!context || context.state === "closed") throw new Error("Audio playback is not available.");
        const rateMatch = /rate=(\d+)/i.exec(mimeType);
        const sampleRate = rateMatch ? Number(rateMatch[1]) : 24000;
        const binary = atob(base64);
        if (!binary.length) return;
        if (binary.length % 2 !== 0) throw new Error("The AI server sent an incomplete audio sample.");
        if (!Number.isFinite(sampleRate) || sampleRate <= 0) throw new Error("The AI server sent an invalid audio sample rate.");
        const audioBuffer = context.createBuffer(1, binary.length / 2, sampleRate);
        const samples = audioBuffer.getChannelData(0);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
        const view = new DataView(bytes.buffer);
        for (let index = 0; index < samples.length; index++) {
          samples[index] = view.getInt16(index * 2, true) / 32768;
        }

        const sourceNode = context.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.connect(context.destination);
        sourceNode.onended = () => {
          playbackSources.delete(sourceNode);
          sourceNode.disconnect();
        };
        const startAt = Math.max(context.currentTime, outputTime);
        sourceNode.start(startAt);
        outputTime = startAt + audioBuffer.duration;
        playbackSources.add(sourceNode);
      }

      function stopPlayback() {
        outputTime = 0;
        for (const sourceNode of playbackSources) {
          sourceNode.onended = null;
          try {
            sourceNode.stop();
          } catch (error) {
            console.warn("Unable to stop an AI audio segment.", error);
          }
          sourceNode.disconnect();
        }
        playbackSources.clear();
      }

      function stop() {
        active = false;
        cancelAnimationFrame(frame);
        stopPlayback();
        if (processor) {
          if (processorKind === "script") processor.onaudioprocess = null;
          if (processorKind === "worklet") processor.port.onmessage = null;
          processor.disconnect();
          processor = null;
          processorKind = "";
        }
        if (source) { source.disconnect(); source = null; }
        if (mute) { mute.disconnect(); mute = null; }
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        if (context) {
          const oldContext = context;
          context = null;
          oldContext.close().catch(error => console.error("Unable to close audio context.", error));
        }
        hasSpeech = false;
        voicedDuration = 0;
        silenceStartedAt = 0;
      }

      return { start, stop, resize: drawVisualizer, playAudioChunk, stopPlayback };
    })();

    const app = (() => {
      let sessionActive = true;
      let startupTimeout = null;

      async function startSession() {
        sessionActive = true;
        UIController.finishAssistantResponse();
        dom.mic.disabled = true;
        dom.splash.classList.remove("hidden");
        dom.splashStep.textContent = "Initializing AudioContext…";
        dom.progress.style.width = "25%";
        UIController.setState(UIController.State.IDLE);
        try {
          const sampleRate = await AudioEngine.start({
            onChunk: chunk => LiveWebSocketClient.sendAudioChunk(chunk),
            onSpeechStart: () => {
              if (!sessionActive) return;
              AudioEngine.stopPlayback();
              UIController.setState(UIController.State.LISTENING, "Listening · speech detected");
              dom.mic.classList.remove("barge-in");
              void dom.mic.offsetWidth;
              dom.mic.classList.add("barge-in");
            },
            onSpeechEnd: duration => {
              if (!sessionActive || duration < 300) return;
              UIController.setState(UIController.State.THINKING);
            }
          });
          if (!sessionActive) {
            AudioEngine.stop();
            return;
          }
          dom.splashStep.textContent = "Establishing WebSocket Session…";
          dom.progress.style.width = "68%";
          await LiveWebSocketClient.connect({
            onData: text => {
              UIController.setState(UIController.State.SPEAKING, "Receiving assistant response");
              UIController.appendAssistantText(text);
            },
            onAudio: (data, mimeType) => {
              try {
                AudioEngine.playAudioChunk(data, mimeType);
              } catch (error) {
                console.error("Unable to play the AI audio response.", error);
                UIController.setState(UIController.State.ERROR, "The AI audio response could not be played.");
              }
            },
            onConnection: (connected, label, detail) => {
              const mode = connected ? "connected" : label === "Connecting" ? "pending" : "error";
              UIController.setConnection(label, mode, detail || (connected ? `Live audio · ${sampleRate} Hz input` : label === "Connecting" ? "Waiting for session setup" : "Check the connection and retry"));
            },
            onError: error => {
              if (sessionActive) UIController.setState(UIController.State.ERROR, error.message);
            },
            onActivity: activity => {
              if (activity === "thinking") UIController.setState(UIController.State.THINKING);
              if (activity === "complete") {
                UIController.finishAssistantResponse();
                window.setTimeout(() => {
                  if (sessionActive) UIController.setState(UIController.State.LISTENING);
                }, 1200);
              }
            }
          });
          if (!sessionActive) {
            LiveWebSocketClient.disconnect();
            AudioEngine.stop();
            return;
          }
          dom.progress.style.width = "100%";
          dom.splashStep.textContent = "Ready · microphone is live";
          UIController.setMicActive(true, "MIC LIVE");
          UIController.setState(UIController.State.LISTENING);
          startupTimeout = setTimeout(() => dom.splash.classList.add("hidden"), 450);
          dom.mic.disabled = false;
        } catch (error) {
          console.error("Could not start the live microphone session.", error);
          if (!sessionActive) return;
          LiveWebSocketClient.disconnect();
          AudioEngine.stop();
          dom.splashStep.textContent = "";
          dom.progress.style.width = "0";
          UIController.setConnection("", "error", "");
          UIController.setState(UIController.State.ERROR, error instanceof Error ? error.message : String(error));
          UIController.setMicActive(false, "MIC OFF");
          dom.mic.disabled = false;
          setTimeout(() => dom.splash.classList.add("hidden"), 250);
        }
      }

      async function endSession() {
        sessionActive = false;
        clearTimeout(startupTimeout);
        AudioEngine.stop();
        UIController.setMicActive(false, "MIC OFF");
        UIController.setState(UIController.State.IDLE);
        UIController.setConnection("", "", "");
        dom.feed.querySelectorAll(".data-card").forEach(card => card.remove());
        UIController.finishAssistantResponse();
        dom.empty.hidden = false;
        dom.scrollButton.hidden = true;
        await LiveWebSocketClient.disconnect();
        window.location.assign(orgSlug ? `/org?org=${encodeURIComponent(orgSlug)}` : "/org");
      }

      function setup() {
        dom.cancel.addEventListener("click", endSession);
        dom.mic.addEventListener("click", () => {
          if (!sessionActive || UIController.getState() === UIController.State.ERROR) void startSession();
        });
        dom.feed.addEventListener("scroll", () => {
          dom.scrollButton.hidden = UIController.isNearBottom();
        }, { passive: true });
        dom.scrollButton.addEventListener("click", () => {
          dom.feed.scrollTo({ top: dom.feed.scrollHeight, behavior: "smooth" });
          dom.scrollButton.hidden = true;
        });
        window.addEventListener("resize", () => AudioEngine.resize(), { passive: true });
        void startSession();
      }

      return { setup, startSession };
    })();

    app.setup();
  </script>
</body>
</html>
